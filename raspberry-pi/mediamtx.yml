# Minimal MediaMTX configuration for GA AI Robot.
# Do not commit real TURN usernames/passwords to a public repository.

logLevel: info
logDestinations: [stdout]

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
# TCP ICE is useful as a fallback on restrictive networks.
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts: []

webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
  - url: stun:stun1.l.google.com:19302

  # CELLULAR / CGNAT FIX:
  # Add a TURN server here on the Raspberry Pi's LOCAL copy of this file.
  # A TURN relay is the robust solution when the LTE carrier's CGNAT prevents
  # direct WebRTC ICE connectivity. Prefer TURN over TCP/TLS as an additional
  # fallback if your TURN provider/server supports it.
  #
  # - url: turn:turn.example.com:3478
  #   username: replace_me
  #   password: replace_me
  #   clientOnly: false
  # - url: turns:turn.example.com:5349
  #   username: replace_me
  #   password: replace_me
  #   clientOnly: false

webrtcSTUNGatherTimeout: 10s
webrtcHandshakeTimeout: 15s
webrtcTrackGatherTimeout: 5s

paths:
  cam:
    source: rpiCamera
    rpiCameraWidth: 1920
    rpiCameraHeight: 1080
    rpiCameraFPS: 30
    rpiCameraBitrate: 2000000
  all_others:
